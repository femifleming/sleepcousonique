<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3f8f"/><stop offset="1" stop-color="#0f1a3d"/>
    </linearGradient>
    <linearGradient id="cord" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8bf4a"/><stop offset="1" stop-color="#b8892a"/>
    </linearGradient>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#night)"/>
    <!-- splatter, as on the tapestry -->
    <g fill="#f3ead2" opacity="0.9">
      <circle cx="250" cy="250" r="7"/><circle cx="820" cy="300" r="5"/><circle cx="300" cy="760" r="6"/>
      <circle cx="760" cy="820" r="4"/><circle cx="190" cy="520" r="4"/><circle cx="870" cy="600" r="6"/>
      <circle cx="420" cy="180" r="4"/><circle cx="640" cy="160" r="3"/><circle cx="560" cy="880" r="5"/>
    </g>
    <g fill="#d2a531">
      <circle cx="350" cy="330" r="9"/><circle cx="361" cy="318" r="3"/><circle cx="700" cy="700" r="8"/>
      <circle cx="712" cy="714" r="3"/><circle cx="180" cy="360" r="5"/>
    </g>
    <!-- the moon -->
    <path d="M610 230 A230 230 0 1 0 800 560 A185 185 0 1 1 610 230 Z" fill="#f3ead2"/>
    <!-- a gold cord from a copper loop, sagging across -->
    <path d="M250 640 C 380 820, 560 820, 690 600" stroke="#5a3a10" stroke-width="44" fill="none" stroke-linecap="round" opacity="0.5" transform="translate(6,14)"/>
    <path d="M250 640 C 380 820, 560 820, 690 600" stroke="url(#cord)" stroke-width="40" fill="none" stroke-linecap="round"/>
    <path d="M250 640 C 380 820, 560 820, 690 600" stroke="#fff3c4" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.5" transform="translate(-4,-6)"/>
    <!-- copper loops -->
    <g>
      <circle cx="250" cy="640" r="52" fill="none" stroke="#8a5428" stroke-width="30"/>
      <circle cx="250" cy="640" r="52" fill="none" stroke="#d08a4c" stroke-width="16" stroke-dasharray="14 10"/>
      <circle cx="250" cy="640" r="16" fill="#7a4a2a"/>
      <circle cx="690" cy="600" r="52" fill="none" stroke="#8a5428" stroke-width="30"/>
      <circle cx="690" cy="600" r="52" fill="none" stroke="#d08a4c" stroke-width="16" stroke-dasharray="14 10"/>
      <circle cx="690" cy="600" r="16" fill="#d2a531"/>
    </g>
  </g>
</svg>
