name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          else
            cmake -B build -A x64
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 4 --target Sleepcousonique ScqTests scqtool

      - name: Test
        shell: bash
        run: |
          exe="$(find build -type f \( -name ScqTests -o -name ScqTests.exe \) -path '*_artefacts*' | head -n 1)"
          echo "== $exe"; "$exe"
          tool="$(find build -type f \( -name scqtool -o -name scqtool.exe \) | head -n 1)"
          for f in examples/*.dream; do "$tool" check "$f" > /dev/null; done

      - name: Package
        shell: bash
        run: ci/package.sh "${{ matrix.name }}" build

      - uses: actions/upload-artifact@v4
        with:
          name: sleepcousonique-${{ matrix.name }}.zip
          path: dist/sleepcousonique-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: The firmware and the manual on their own too
        run: |
          cp firmware/dist/sleepcousonique-sp1.bin docs/manual/Sleepcousonique-Manual.pdf packages/
          cd packages && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: sleepcousonique ${{ github.ref_name }}
          body_path: docs/RELEASE.md
          files: packages/*
