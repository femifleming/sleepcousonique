name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          else
            cmake -B build -A x64
          fi

      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release --parallel 4 --target Sleepcousonique ScqTests ScqSerialTest scqtool ScqSweep
          if [ "$RUNNER_OS" = "macOS" ]; then cmake --build build --config Release --parallel 4 --target SleepcousoniqueArray fakesp1; fi

      - name: Test
        shell: bash
        run: |
          exe="$(find build -type f \( -name ScqTests -o -name ScqTests.exe \) -path '*_artefacts*' | head -n 1)"
          echo "== $exe"; "$exe"
          tool="$(find build -type f \( -name scqtool -o -name scqtool.exe \) | head -n 1)"
          for f in examples/*.dream; do "$tool" check "$f" > /dev/null; done

      - name: The USB link against a pretend SP-1 (send to SP-1, standby, busy, stuck, older firmware)
        shell: bash
        run: |
          st="$(find build -type f \( -name ScqSerialTest -o -name ScqSerialTest.exe \) -path '*_artefacts*' | head -n 1)"
          echo "== $st"; "$st"
          echo "== the ports this runner would try (none expected)"; "$st" --ports
          if [ "$RUNNER_OS" = "macOS" ]; then tools/test_send.sh build; fi

      - name: Sweep (every place, every inlet, fader and attenuverter at their ends)
        shell: bash
        run: |
          sweep="$(find build -type f \( -name ScqSweep -o -name ScqSweep.exe \) | head -n 1)"
          echo "== $sweep"
          pids=""
          for k in 1 2 3 4; do "$sweep" -j $k/4 > "sweep$k.txt" 2>&1 & pids="$pids $!"; done
          bad=0
          for p in $pids; do wait $p || bad=1; done
          cat sweep?.txt
          exit $bad

      - name: Package
        shell: bash
        run: |
          ci/package.sh "${{ matrix.name }}" build
          if [ "$RUNNER_OS" = "Windows" ]; then PY=python; else PY=python3; fi
          "$PY" tools/check_package.py "dist/sleepcousonique-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: sleepcousonique-${{ matrix.name }}.zip
          path: dist/sleepcousonique-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: The firmware and the manual on their own too
        run: |
          cp firmware/dist/sleepcousonique-sp1.bin docs/manual/Sleepcousonique-Manual.pdf packages/
          cp firmware-wingie/dist/sleepcousonique-wingie.bin docs/wingie-manual/Sleepcousonique-Wingie-Manual.pdf packages/
          cd packages && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: sleepcousonique ${{ github.ref_name }}
          body_path: docs/RELEASE.md
          files: packages/*
